<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>① 購入 - 詳細図 | 購入＆支払いフロー AI DX化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">
    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <span class="font-semibold text-slate-900 tracking-tight">① 購入 - 詳細フロー</span>
            <a href="index.html#home" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-950 hover:bg-indigo-900 rounded-xl transition-colors shadow-sm">
                ← 業務フローに戻る
            </a>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-5xl mx-auto px-6 py-10 flex-grow w-full space-y-6">
        <div class="bg-white rounded-2xl border border-slate-200/80 p-6 md:p-8 shadow-sm space-y-4">
            <h2 class="text-xl font-bold text-slate-900">① 購入ステップの詳細図</h2>
            <p class="text-slate-600 text-sm">下の画像をクリックすると、さらに拡大して詳細を確認できます。</p>
            
            <!-- クリックで拡大できる画像（step1） -->
            <div class="cursor-pointer group relative overflow-hidden rounded-xl border border-slate-200" onclick="openModal('modal-step1', 'step1-modal-img')">
                <img src="step1.png" alt="購入詳細図" class="w-full h-auto">
                <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                    <span class="bg-slate-900/80 text-white text-xs px-3.5 py-2 rounded-lg font-medium shadow-md">🔍 クリックして拡大表示</span>
                </div>
            </div>

            <!-- タイトル「購入品目カテゴリ表 詳細」と category.png -->
            <div class="pt-8 space-y-4 border-t border-slate-100 mt-8">
                <h3 class="text-lg font-bold text-slate-900">購入品目カテゴリ表 詳細</h3>
                <p class="text-slate-600 text-sm">下の画像をクリックすると、さらに拡大して詳細を確認できます。</p>
                
                <!-- クリックで拡大できる画像（category） -->
                <div class="cursor-pointer group relative overflow-hidden rounded-xl border border-slate-200" onclick="openModal('modal-category', 'category-modal-img')">
                    <img src="category.png" alt="購入品目カテゴリ表 詳細" class="w-full h-auto">
                    <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <span class="bg-slate-900/80 text-white text-xs px-3.5 py-2 rounded-lg font-medium shadow-md">🔍 クリックして拡大表示</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 拡大モーダル（step1用） -->
    <div id="modal-step1" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeModal('modal-step1')">
        <div class="relative max-w-[95vw] max-h-[90vh] bg-white rounded-2xl p-4 shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100 shrink-0">
                <h3 class="font-bold text-slate-900 text-sm">購入ステップ（拡大表示）</h3>
                <button type="button" onclick="closeModal('modal-step1')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition-colors">✕ 閉じる</button>
            </div>
            <div class="overflow-auto flex-grow rounded-xl border border-slate-100 max-h-[80vh]">
                <img src="step1.png" alt="購入詳細図 拡大" class="w-auto min-w-[1000px] max-w-none">
            </div>
        </div>
    </div>

    <!-- 拡大モーダル（category用） -->
    <div id="modal-category" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeModal('modal-category')">
        <div class="relative max-w-[95vw] max-h-[90vh] bg-white rounded-2xl p-4 shadow-2xl flex flex-col" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100 shrink-0">
                <h3 class="font-bold text-slate-900 text-sm">購入品目カテゴリ表 詳細（拡大表示）</h3>
                <button type="button" onclick="closeModal('modal-category')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition-colors">✕ 閉じる</button>
            </div>
            <div class="overflow-auto flex-grow rounded-xl border border-slate-100 max-h-[80vh]">
                <img src="category.png" alt="購入品目カテゴリ表 詳細 拡大" class="w-auto min-w-[1000px] max-w-none">
            </div>
        </div>
    </div>

    <!-- フッター -->
    <footer class="border-t border-slate-200 bg-white py-6 mt-10">
        <div class="max-w-5xl mx-auto px-6 text-center text-xs text-slate-500">
            &copy; 2026 購入＆支払いフロー AI DX化 Project. All rights reserved.
        </div>
    </footer>

    <script>
        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal('modal-step1');
                closeModal('modal-category');
            }
        });
    </script>
</body>
</html>
